<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Asistent | Vaša Digitalna Podrška</title>
    <!-- Učitavanje modernih fontova -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Varijable za Glassmorphism temu */
        :root {
            --bg-dark: #070b14;
            --glass-surface: rgba(255, 255, 255, 0.04);
            --glass-surface-strong: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-glow: rgba(59, 130, 246, 0.45);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }

        /* Reset i osnovne postavke */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 2rem 1.25rem 4rem;
        }

        /* Žive pozadinske kugle za efekt zamućenog stakla (Glassmorphism) */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            z-index: -1;
            pointer-events: none;
            opacity: 0.65;
            animation: floatOrb 14s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 45vw;
            height: 45vw;
            max-width: 550px;
            max-height: 550px;
            background: radial-gradient(circle, #3b82f6, #1d4ed8);
            top: -10%;
            left: -5%;
        }

        .orb-2 {
            width: 40vw;
            height: 40vw;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(circle, #8b5cf6, #5b21b6);
            top: 35%;
            right: -8%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 50vw;
            height: 50vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(circle, #06b6d4, #0369a1);
            bottom: -15%;
            left: 15%;
            opacity: 0.4;
            animation-delay: -9s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.08); }
        }

        /* Glavni Glass Container za cijelu stranicu */
        .glass-layout {
            width: 100%;
            max-width: 860px;
            background: var(--glass-surface);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        /* 1. SEKCIJA: SLIKA NA VRHU */
        .hero-image-frame {
            width: 100%;
            height: 290px;
            border-radius: 22px;
            overflow: hidden;
            position: relative;
            background: var(--glass-surface-strong);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .hero-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .hero-image-frame:hover img {
            transform: scale(1.03);
        }

        /* Suptilni stakleni sjaj preko slike */
        .hero-image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(7, 11, 20, 0.05) 0%, rgba(7, 11, 20, 0.45) 100%);
            pointer-events: none;
        }

        /* 2. SEKCIJA: TEKST I CTA ISPOD SLIKE */
        .hero-text-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 640px;
        }

        .glass-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.5rem 1.15rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 10px #34d399;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 20%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-description {
            font-size: 1.075rem;
            line-height: 1.65;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* Glass CTA Gumb */
        .btn-glass-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2.25rem;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.85), rgba(139, 92, 246, 0.85));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            font-weight: 600;
            font-size: 1.05rem;
            text-decoration: none;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 30px -5px var(--accent-glow), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-glass-cta:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.95), rgba(139, 92, 246, 0.95));
            box-shadow: 0 18px 35px -5px rgba(59, 130, 246, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.5);
        }

        .btn-glass-cta:active {
            transform: translateY(0);
        }

        .btn-glass-cta svg {
            width: 20px;
            height: 20px;
            transition: transform 0.25s ease;
        }

        .btn-glass-cta:hover svg {
            transform: translateY(2px);
        }

        /* 3. SEKCIJA: GLASS CHAT WINDOW NA DNU */
        .chat-glass-window {
            width: 100%;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
            transition: all 0.35s ease;
        }

        /* Fokus efekt kada korisnik klikne na CTA gumb */
        .chat-glass-window:target {
            border-color: rgba(96, 165, 250, 0.7);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25), 0 25px 50px -12px rgba(0, 0, 0, 0.65);
        }

        .chat-window-bar {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-bar-left {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .window-controls {
            display: flex;
            gap: 0.4rem;
            margin-right: 0.35rem;
        }

        .control-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }

        .chat-bar-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chat-bar-title span {
            font-size: 0.75rem;
            font-weight: 500;
            color: #34d399;
            background: rgba(52, 211, 153, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.25);
            padding: 0.15rem 0.55rem;
            border-radius: 999px;
        }

        .btn-fullscreen {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.8rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .btn-fullscreen:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.14);
        }

        .chat-iframe-box {
            width: 100%;
            height: 520px;
            background: rgba(255, 255, 255, 0.95);
            position: relative;
        }

        .chat-iframe-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Responzivnost za mobilne uređaje */
        @media (max-width: 640px) {
            body {
                padding: 1rem 0.75rem 2.5rem;
            }

            .glass-layout {
                padding: 1.35rem;
                border-radius: 24px;
                gap: 1.75rem;
            }

            .hero-image-frame {
                height: 200px;
                border-radius: 16px;
            }

            .btn-glass-cta {
                width: 100%;
                justify-content: center;
            }

            .window-controls {
                display: none;
            }

            .chat-iframe-box {
                height: 460px;
            }
        }
    </style>
</head>
<body>

    <!-- Pozadinski lebdeći svjetlosni efekti za Glassmorphism -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <!-- Glavni Glassmorphism Kontejner -->
    <main class="glass-layout">
        
        <!-- 1. SLIKA (Vrh) -->
        <div class="hero-image-frame">
            <img 
                src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1400&q=80" 
                alt="Moderna apstraktna 3D glass ilustracija"
                onerror="this.src='https://placehold.co/1200x500/0f172a/38bdf8?text=AI+Digitalna+Podrska'"
            >
            <div class="hero-image-overlay"></div>
        </div>

        <!-- 2. TEKST I CTA GUMB (Sredina) -->
        <section class="hero-text-section">
            <div class="glass-badge">
                <span class="status-dot"></span>
                <span>AI Asistent aktivan 24/7</span>
            </div>

            <h1>Vaša pametna podrška u stvarnom vremenu.</h1>

            <p class="hero-description">
                Dobijte brze, precizne i pouzdane odgovore na sva vaša pitanja bez čekanja. Započnite razgovor odmah u prozoru ispod.
            </p>

            <a href="#chat-window" class="btn-glass-cta">
                <span>Započni razgovor</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                </svg>
            </a>
        </section>

        <!-- 3. CHAT WINDOW (Dno) -->
        <section id="chat-window" class="chat-glass-window" aria-label="Chatbox prozor">
            <div class="chat-window-bar">
                <div class="chat-bar-left">
                    <div class="window-controls">
                        <span class="control-dot"></span>
                        <span class="control-dot"></span>
                        <span class="control-dot"></span>
                    </div>
                    <div class="chat-bar-title">
                        Digitalni Asistent
                        <span>Online</span>
                    </div>
                </div>

                <a href="https://script.google.com/macros/s/AKfycbxvsUuAi46CMpnESQyMiSlV3njpznN3pdiS5n4RxzfO1YMUO6u0Up6vLEK3l9HltM5G/exec" target="_blank" rel="noopener noreferrer" class="btn-fullscreen" title="Otvori u novom tabu">
                    <span>Otvori zasebno</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                </a>
            </div>

            <div class="chat-iframe-box">
                <iframe 
                    src="https://script.google.com/macros/s/AKfycbyFEGuOHlYSzwWhRlwo_tDlxJKUbRncnMRA2z__Ek4d6UeRNh3Sr-A5B8El8_tNj2-9/exec" 
                    title="Chatbox Asistent"
                    allow="microphone; clipboard-read; clipboard-write"
                    loading="lazy">
                </iframe>
            </div>
        </section>

    </main>

</body>
</html>
